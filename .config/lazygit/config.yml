# Colemak keybindings for lazygit — full hnei navigation, matching the rest of
# these dotfiles (tmux, nvim). lazygit ships hjkl; on a Colemak layout those land
# off the home row, so navigation moves to h / n / e / i:
#
#   h ← prev block (left)      i → next block (right)
#   n ↓ next item  (down)      e ↑ prev item  (up)
#
# n / e / i are action keys by default, so every colliding action is reassigned
# below. Remapping nav off j/k/l also frees those keys, used here for search.
#
#   reassigned action            old key → new key
#   ─────────────────────────────────────────────
#   new (branch/tag/remote/…)        n → N
#   edit                             e → E
#   ignore file                      i → I   (files)
#   git-flow options                 i → Q   (branches)
#   start interactive rebase         i → U   (commits)
#   init submodule                   i → Z   (submodules)
#   edit hunk                        E → X   (staging; frees E for edit)
#   search next / prev match       n/N → j / k  (freed by the nav remap)
keybinding:
  universal:
    nextItem:  ["<down>", "n"]                # down  (was j)
    prevItem:  ["<up>", "e"]                  # up    (was k)
    prevBlock: ["<left>", "h", "<backtab>"]   # left  (h kept — already default)
    nextBlock: ["<right>", "i", "<tab>"]      # right (was l)
    new:  "N"                                 # frees 'n' for "down"
    edit: "E"                                 # frees 'e' for "up"
    nextMatch: "j"                            # search next match (was n)
    prevMatch: "k"                            # search prev match (was N → frees N for new)
  files:
    ignoreFile: "I"                           # frees 'i' for "right"
  branches:
    viewGitFlowOptions: "Q"                   # frees 'i'
  commits:
    startInteractiveRebase: "U"               # frees 'i'
  submodules:
    init: "Z"                                 # frees 'i'
  main:
    editSelectHunk: "X"                       # frees 'E' for "edit"

# Kanagawa-matched selection colours — the default blue washes out the green
# diff text on the selected hunk. Wave-blue bg keeps added/removed lines legible.
gui:
  theme:
    selectedLineBgColor:  ["#2d4f67"]
    selectedRangeBgColor: ["#2d4f67"]
